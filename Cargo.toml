[package]
name = "rust-music-poc"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"

[dependencies]
dirs = "6.0"
env_logger = "0.11"
lofty = "0.22"
nsh-base = "0.7.1"
nsh-core = "0.7.1"
rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }
walkdir = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.7.1", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.7.1", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.7.1", default-features = false, features = ["svg"] }

[dev-dependencies]
tempfile = "3.20"
