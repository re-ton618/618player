[package]
name = "rust-music-poc"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-only"

[dependencies]
cpal = "0.18.2"
dirs = "6.0"
env_logger = "0.11"
lofty = "0.22"
nsh-base = "0.7.1"
nsh-core = "0.7.1"
rtrb = "0.4.1"
rubato = "5.1"
rusqlite = { version = "0.39", default-features = false, features = ["bundled"] }
symphonia = { version = "0.6.1", features = ["all"] }
symphonia-opus = "0.1.3"
tokio = { version = "1", default-features = false, features = ["sync"] }
walkdir = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.7.1", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.7.1", default-features = false, features = ["svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.7.1", default-features = false, features = ["svg"] }

[dev-dependencies]
tempfile = "3.20"

# Decoding and resampling are too slow unoptimized to play in a dev build;
# the crate itself stays incremental.
[profile.dev.package."*"]
opt-level = 2
